<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ご当地マスター - 都道府県当て観光クイズ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #f59e0b;
      --accent-grad: linear-gradient(135deg, #f59e0b, #ef4444);
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.2);
      --wrong: #ef4444;
      --wrong-bg: rgba(239, 68, 68, 0.2);
      --badge-hotspring: #ec4899;
      --badge-road: #06b6d4;
      --badge-spot: #8b5cf6;
      --badge-gourmet: #f97316;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      touch-action: manipulation;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 860px;
      background: radial-gradient(circle at 50% 10%, #1c2541 0%, #0b132b 100%);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    /* 上部ナビゲーションバー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(11, 19, 43, 0.85);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      z-index: 30;
      flex-shrink: 0;
    }

    .nav-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .nav-btn:active {
      transform: scale(0.95);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
    }

    /* 画面切り替え共通スタイル */
    .screen {
      flex: 1;
      width: 100%;
      height: calc(100% - 61px);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      position: relative;
    }

    .screen.active {
      display: flex !important;
    }

    /* --- スタート画面 --- */
    #start-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px 20px;
      gap: 18px;
    }

    .game-logo {
      font-size: 54px;
      margin-bottom: 4px;
      animation: floatLogo 3s ease-in-out infinite;
    }
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .game-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .game-subtitle {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .genre-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 10px 0;
    }

    .genre-chip {
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .genre-chip.onsen { background: rgba(236, 72, 153, 0.2); border: 1px solid var(--badge-hotspring); color: #f472b6; }
    .genre-chip.meido { background: rgba(6, 182, 212, 0.2); border: 1px solid var(--badge-road); color: #22d3ee; }
    .genre-chip.meisho { background: rgba(139, 92, 246, 0.2); border: 1px solid var(--badge-spot); color: #c084fc; }
    .genre-chip.gourmet { background: rgba(249, 115, 22, 0.2); border: 1px solid var(--badge-gourmet); color: #fb923c; }

    .rule-card {
      background: rgba(28, 37, 65, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      width: 100%;
      max-width: 380px;
      text-align: left;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .rule-card ul {
      list-style-type: none;
      padding-left: 0;
    }
    .rule-card li {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rule-card li:last-child {
      margin-bottom: 0;
    }

    .primary-btn {
      background: var(--accent-grad);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      width: 100%;
      max-width: 320px;
    }
    .primary-btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
    }

    /* --- プレイ画面 --- */
    #play-screen {
      padding: 12px 16px;
      justify-content: space-between;
      gap: 12px;
    }

    .play-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .play-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .q-badge {
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #f8fafc;
      font-size: 14px;
    }

    /* タイマーバー */
    .timer-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #10b981 0%, #38bdf8 70%, #f59e0b 100%);
      border-radius: 4px;
      transition: width 0.05s linear;
    }

    .timer-fill.warning {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    /* スポット出題カード */
    .spot-card-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }

    .spot-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .spot-card.shake {
      animation: shake 0.4s ease-in-out;
      border-color: var(--wrong);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .spot-genre-tag {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .spot-genre-tag.onsen { background: rgba(236, 72, 153, 0.25); color: #f472b6; border: 1px solid var(--badge-hotspring); }
    .spot-genre-tag.meido { background: rgba(6, 182, 212, 0.25); color: #22d3ee; border: 1px solid var(--badge-road); }
    .spot-genre-tag.meisho { background: rgba(139, 92, 246, 0.25); color: #c084fc; border: 1px solid var(--badge-spot); }
    .spot-genre-tag.gourmet { background: rgba(249, 115, 22, 0.25); color: #fb923c; border: 1px solid var(--badge-gourmet); }

    .spot-icon {
      font-size: 64px;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .spot-name {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      line-height: 1.3;
      word-break: break-all;
    }

    .spot-prompt {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* 4択ボタン（2×2グリッド） */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      flex-shrink: 0;
    }

    .choices-grid.disabled {
      pointer-events: none;
    }

    .choice-btn {
      background: #1e293b;
      border: 2px solid var(--card-border);
      color: #f8fafc;
      font-size: 18px;
      font-weight: 700;
      padding: 16px 8px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      min-height: 60px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .choice-btn:active {
      transform: scale(0.97);
    }

    .choice-btn.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: #34d399 !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.5) !important;
    }

    .choice-btn.wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: #f87171 !important;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.5) !important;
    }

    .choice-btn.reveal {
      border-color: var(--correct) !important;
      color: #34d399 !important;
      background: rgba(16, 185, 129, 0.1) !important;
    }

    /* --- リザルト画面 --- */
    #result-screen {
      padding: 16px 12px 24px;
      gap: 16px;
      align-items: center;
    }

    .result-summary-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 20px 16px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .result-rank-title {
      font-size: 24px;
      font-weight: 800;
      color: #f59e0b;
    }

    .result-score-large {
      font-size: 40px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .result-score-large span {
      font-size: 20px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .result-stats-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 13px;
      color: var(--text-sub);
    }
    .result-stat-val {
      font-weight: 700;
      color: #ffffff;
      font-size: 15px;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 420px;
    }

    .secondary-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }
    .secondary-btn:active {
      transform: scale(0.96);
    }

    /* 答え合わせ一覧セクション */
    .review-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .review-title {
      font-size: 16px;
      font-weight: 800;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .review-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .review-card.correct-item {
      border-left: 4px solid var(--correct);
    }
    .review-card.wrong-item {
      border-left: 4px solid var(--wrong);
    }

    .review-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .review-spot-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .review-status-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .review-status-tag.correct {
      background: var(--correct-bg);
      color: #34d399;
    }
    .review-status-tag.wrong {
      background: var(--wrong-bg);
      color: #f87171;
    }

    .review-card-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .review-answer-info {
      font-size: 13px;
      line-height: 1.5;
    }

    .review-correct-pref {
      color: #38bdf8;
      font-weight: 700;
    }

    .review-user-pref {
      color: var(--text-sub);
      font-size: 12px;
    }
    .review-user-pref.incorrect {
      color: #f87171;
    }

    .map-btn {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s, background 0.15s;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }
    .map-btn:active {
      transform: scale(0.95);
    }

  </style>
</head>
<body>
  <div id="app-container">
    <!-- 上部ナビゲーションバー -->
    <header class="top-bar">
      <a href="./index.html" class="nav-btn">
        <span>🏠 ポータル</span>
      </a>
      <div style="font-weight: 800; font-size: 14px; letter-spacing: 0.5px; color: #38bdf8;">ご当地マスター 🗾</div>
      <button id="sound-btn" class="nav-btn icon-btn" title="効果音切替">
        🔊
      </button>
    </header>

    <!-- 1. スタート画面 -->
    <section id="start-screen" class="screen active">
      <div class="game-logo">🗾</div>
      <h1 class="game-title">ご当地マスター</h1>
      <p class="game-subtitle">観光地・名物 都道府県当てクイズ</p>

      <div class="genre-chips">
        <span class="genre-chip onsen">♨️ 百名湯</span>
        <span class="genre-chip meido">🛣️ 百名道</span>
        <span class="genre-chip meisho">🏯 名所</span>
        <span class="genre-chip gourmet">🍜 グルメ</span>
      </div>

      <div class="rule-card">
        <ul>
          <li>⏱️ <strong>全20問出題</strong>（4ジャンル各5問バランス出題）</li>
          <li>⏳ <strong>1問8秒</strong>のシンキングタイム！</li>
          <li>🗺️ 終了後に<strong>答え合わせ＆Google マップ詳細リンク</strong>付き！</li>
        </ul>
      </div>

      <button id="start-btn" class="primary-btn">クイズを始める！</button>
    </section>

    <!-- 2. プレイ画面 -->
    <section id="play-screen" class="screen">
      <div class="play-header">
        <div class="play-stats-row">
          <span id="question-badge" class="q-badge">第 1 / 20 問</span>
          <div class="score-badge">
            <span>⭕ 正解: </span>
            <strong id="correct-count" style="color: #38bdf8;">0</strong>
          </div>
        </div>
        <div class="timer-track">
          <div id="timer-bar" class="timer-fill"></div>
        </div>
      </div>

      <div class="spot-card-container">
        <div id="spot-card" class="spot-card">
          <span id="spot-genre" class="spot-genre-tag onsen">温泉</span>
          <div id="spot-icon" class="spot-icon">♨️</div>
          <div id="spot-name" class="spot-name">登別温泉</div>
          <div class="spot-prompt">この観光地・名物はどこの都道府県？</div>
        </div>
      </div>

      <div id="choices-container" class="choices-grid">
        <button class="choice-btn" data-index="0">北海道</button>
        <button class="choice-btn" data-index="1">青森県</button>
        <button class="choice-btn" data-index="2">秋田県</button>
        <button class="choice-btn" data-index="3">岩手県</button>
      </div>
    </section>

    <!-- 3. リザルト画面 -->
    <section id="result-screen" class="screen">
      <div class="result-summary-card">
        <div id="result-rank" class="result-rank-title">全国観光大使 🏆</div>
        <div class="result-score-large">
          <span id="result-correct-num">18</span> <span>/ 20 問</span>
        </div>
        <div class="result-stats-row">
          <div>正答率: <span id="result-accuracy" class="result-stat-val">80%</span></div>
        </div>
      </div>

      <div class="result-actions">
        <button id="retry-btn" class="primary-btn" style="flex: 1; padding: 12px 18px; font-size: 15px;">もう一度挑戦！</button>
        <a href="./index.html" class="secondary-btn" style="flex: 1;">ポータルへ</a>
      </div>

      <div class="review-section">
        <div class="review-title">
          <span>📝 答え合わせ & 観光地マップ</span>
        </div>
        <div id="review-list" class="review-list">
          <!-- JSで動的生成 -->
        </div>
      </div>
    </section>
  </div>

  <script>
    (function() {
      'use strict';

      // --- 全171問出題データベース（温泉47・名道30・名所47・グルメ47） ---
      const QUIZ_DATABASE = [
        // 1. 温泉（47都道府県完全網羅・47問）
        { genre: "温泉", spot: "登別温泉", prefecture: "北海道", icon: "♨️", mapQuery: "登別温泉 北海道" },
        { genre: "温泉", spot: "酸ヶ湯温泉", prefecture: "青森県", icon: "♨️", mapQuery: "酸ヶ湯温泉 青森県" },
        { genre: "温泉", spot: "花巻温泉郷", prefecture: "岩手県", icon: "♨️", mapQuery: "花巻温泉郷 岩手県" },
        { genre: "温泉", spot: "鳴子温泉", prefecture: "宮城県", icon: "♨️", mapQuery: "鳴子温泉 宮城県" },
        { genre: "温泉", spot: "乳頭温泉郷", prefecture: "秋田県", icon: "♨️", mapQuery: "乳頭温泉郷 秋田県" },
        { genre: "温泉", spot: "銀山温泉", prefecture: "山形県", icon: "♨️", mapQuery: "銀山温泉 山形県" },
        { genre: "温泉", spot: "飯坂温泉", prefecture: "福島県", icon: "♨️", mapQuery: "飯坂温泉 福島県" },

        { genre: "グルメ", spot: "讃岐うどん", prefecture: "香川県", icon: "🍜", mapQuery: "讃岐うどん 香川県" },
        { genre: "グルメ", spot: "宇和島鯛めし", prefecture: "愛媛県", icon: "🍜", mapQuery: "宇和島鯛めし 愛媛県" },
        { genre: "グルメ", spot: "カツオのたたき", prefecture: "高知県", icon: "🍜", mapQuery: "カツオのたたき 高知県" },
        { genre: "グルメ", spot: "辛子明太子", prefecture: "福岡県", icon: "🍜", mapQuery: "辛子明太子 福岡県" },
        { genre: "グルメ", spot: "呼子のイカ", prefecture: "佐賀県", icon: "🍜", mapQuery: "呼子のイカ 佐賀県" },
        { genre: "グルメ", spot: "長崎ちゃんぽん", prefecture: "長崎県", icon: "🍜", mapQuery: "長崎ちゃんぽん 長崎県" },
        { genre: "グルメ", spot: "馬刺し", prefecture: "熊本県", icon: "🍜", mapQuery: "馬刺し 熊本県" },
        { genre: "グルメ", spot: "中津からあげ", prefecture: "大分県", icon: "🍜", mapQuery: "中津からあげ 大分県" },
        { genre: "グルメ", spot: "チキン南蛮", prefecture: "宮崎県", icon: "🍜", mapQuery: "チキン南蛮 宮崎県" },
        { genre: "グルメ", spot: "黒豚しゃぶしゃぶ", prefecture: "鹿児島県", icon: "🍜", mapQuery: "黒豚しゃぶしゃぶ 鹿児島県" },
        { genre: "グルメ", spot: "ソーキそば", prefecture: "沖縄県", icon: "🍜", mapQuery: "ソーキそば 沖縄県" },
      ];

      // 47都道府県マスター
      const PREFECTURES = [
        "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県",
        "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県",
        "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県",
        "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県",
        "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県",
        "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県",
        "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"
      ];

      // 設定定数
      const TOTAL_QUESTIONS = 20;
      const QUESTION_TIME_LIMIT_SEC = 8;
      const CORRECT_DELAY_MS = 600;
      const WRONG_DELAY_MS = 900;
      const TIMEOUT_DELAY_MS = 900;

      // ゲーム状態
      let currentQueue = [];
      let currentIndex = 0;
      let correctCount = 0;
      let currentQuestion = null;
      let questionStartTime = 0;
      let timerAnimId = null;
      let isAnswerLocked = false;
      let isGameActive = false;
      let resultsLog = []; // { spot, genre, icon, correctPref, userPref, isCorrect, mapQuery }

      // 音声管理（Web Audio API）
      let audioCtx = null;
      let soundEnabled = (localStorage.getItem('travel_quiz_sound') !== 'false');

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(type) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (type === 'correct') {
            // 明るいチャイム（G5 -> C6）
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(783.99, now); // G5
            osc.frequency.setValueAtTime(1046.50, now + 0.12); // C6
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.start(now);
            osc.stop(now + 0.45);
          } else if (type === 'wrong') {
            // 不正解ブザー（低音ノコギリ波）
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now); // A3
            osc.frequency.setValueAtTime(164.81, now + 0.15); // E3
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.start(now);
            osc.stop(now + 0.45);
          } else if (type === 'timeout') {
            // 時間切れ
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(330, now + 0.12);
            osc.frequency.setValueAtTime(220, now + 0.24);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.start(now);
            osc.stop(now + 0.45);
          } else if (type === 'finish') {
            // クリアファンファーレ
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
              const o = audioCtx.createOscillator();
              const g = audioCtx.createGain();
              o.connect(g);
              g.connect(audioCtx.destination);
              o.type = 'triangle';
              o.frequency.setValueAtTime(freq, now + idx * 0.1);
              g.gain.setValueAtTime(0.18, now + idx * 0.1);
              g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);
              o.start(now + idx * 0.1);
              o.stop(now + idx * 0.1 + 0.35);
            });
          }
        } catch (e) {
          console.error("Audio playback error:", e);
        }
      }

      // UI要素参照
      const screenStart = document.getElementById('start-screen');
      const screenPlay = document.getElementById('play-screen');
      const screenResult = document.getElementById('result-screen');

      const soundBtn = document.getElementById('sound-btn');
      const startBtn = document.getElementById('start-btn');
      const retryBtn = document.getElementById('retry-btn');

      const questionBadge = document.getElementById('question-badge');
      const correctCountEl = document.getElementById('correct-count');
      const timerBar = document.getElementById('timer-bar');

      const spotCard = document.getElementById('spot-card');
      const spotGenre = document.getElementById('spot-genre');
      const spotIcon = document.getElementById('spot-icon');
      const spotName = document.getElementById('spot-name');
      const choicesContainer = document.getElementById('choices-container');
      const choiceButtons = Array.from(document.querySelectorAll('.choice-btn'));

      const resultRank = document.getElementById('result-rank');
      const resultCorrectNum = document.getElementById('result-correct-num');
      const resultAccuracy = document.getElementById('result-accuracy');
      const reviewList = document.getElementById('review-list');

      // サウンドボタン状態更新
      function updateSoundBtn() {
        soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
      }
      updateSoundBtn();

      soundBtn.addEventListener('click', () => {
        initAudio();
        soundEnabled = !soundEnabled;
        localStorage.setItem('travel_quiz_sound', soundEnabled ? 'true' : 'false');
        updateSoundBtn();
      });

      // 画面切り替え
      function showScreen(targetScreen) {
        [screenStart, screenPlay, screenResult].forEach(s => s.classList.remove('active'));
        targetScreen.classList.add('active');
      }

      // シャッフルヘルパー (Fisher-Yates)
      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      // 出題キュー生成（完全均等層化サンプリング / 4ジャンル×各5問＝計20問）
      function buildStratifiedQueue() {
        const genres = ["温泉", "名道", "名所", "グルメ"];
        const byGenre = {};
        genres.forEach(g => {
          byGenre[g] = shuffleArray(QUIZ_DATABASE.filter(item => item.genre === g));
        });

        const selectedItems = [];

        // 4ジャンルから各5問ずつ均等抽出 (4ジャンル × 5問 = 計20問)
        genres.forEach(g => {
          for (let i = 0; i < 5; i++) {
            selectedItems.push(byGenre[g].pop());
          }
        });

        // 全体シャッフル
        return shuffleArray(selectedItems);
      }

      // 誤答3択の抽出（47都道府県から正解を除外した残りからランダム選出）
      function generateChoices(correctPref) {
        const wrongPool = PREFECTURES.filter(p => p !== correctPref);
        const shuffledWrong = shuffleArray(wrongPool).slice(0, 3);
        const allChoices = shuffleArray([correctPref, ...shuffledWrong]);
        return allChoices;
      }

      // ゲーム開始
      function startGame() {
        initAudio();
        currentQueue = buildStratifiedQueue();
        currentIndex = 0;
        correctCount = 0;
        resultsLog = [];
        isGameActive = true;

        showScreen(screenPlay);
        renderQuestion();
      }

      // 問題の描画
      function renderQuestion() {
        if (currentIndex >= TOTAL_QUESTIONS) {
          finishGame();
          return;
        }

        currentQuestion = currentQueue[currentIndex];
        isAnswerLocked = false;
        choicesContainer.classList.remove('disabled');

        // UI反映
        questionBadge.textContent = `第 ${currentIndex + 1} / ${TOTAL_QUESTIONS} 問`;
        correctCountEl.textContent = correctCount;

        // ジャンルクラス設定
        const genreClassMap = {
          "温泉": "onsen",
          "名道": "meido",
          "名所": "meisho",
          "グルメ": "gourmet"
        };
        const gClass = genreClassMap[currentQuestion.genre] || "onsen";
        spotGenre.className = `spot-genre-tag ${gClass}`;
        spotGenre.textContent = currentQuestion.genre;
        spotIcon.textContent = currentQuestion.icon;
        spotName.textContent = currentQuestion.spot;

        // 選択肢生成とボタン配置
        const choices = generateChoices(currentQuestion.prefecture);
        choiceButtons.forEach((btn, idx) => {
          btn.className = 'choice-btn';
          btn.textContent = choices[idx];
          btn.disabled = false;
        });

        // タイマー開始
        startQuestionTimer();
      }

      // タイマー制御
      function startQuestionTimer() {
        if (timerAnimId) cancelAnimationFrame(timerAnimId);
        timerBar.style.width = '100%';
        timerBar.classList.remove('warning');
        questionStartTime = performance.now();

        function updateTimer(now) {
          if (!isGameActive || isAnswerLocked) return;

          const elapsedSec = (now - questionStartTime) / 1000;
          const remainingSec = Math.max(0, QUESTION_TIME_LIMIT_SEC - elapsedSec);
          const ratio = remainingSec / QUESTION_TIME_LIMIT_SEC;

          timerBar.style.width = `${(ratio * 100).toFixed(1)}%`;
          if (remainingSec <= 2.5) {
            timerBar.classList.add('warning');
          } else {
            timerBar.classList.remove('warning');
          }

          if (remainingSec <= 0) {
            handleTimeout();
          } else {
            timerAnimId = requestAnimationFrame(updateTimer);
          }
        }

        timerAnimId = requestAnimationFrame(updateTimer);
      }

      // 回答タップ時処理
      choiceButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          if (isAnswerLocked || !isGameActive || !currentQuestion) return;

          isAnswerLocked = true;
          choicesContainer.classList.add('disabled');
          if (timerAnimId) cancelAnimationFrame(timerAnimId);

          const selectedPref = btn.textContent;
          const isCorrect = (selectedPref === currentQuestion.prefecture);

          resultsLog.push({
            spot: currentQuestion.spot,
            genre: currentQuestion.genre,
            icon: currentQuestion.icon,
            correctPref: currentQuestion.prefecture,
            userPref: selectedPref,
            isCorrect: isCorrect,
            mapQuery: currentQuestion.mapQuery
          });

          if (isCorrect) {
            correctCount++;
            correctCountEl.textContent = correctCount;
            btn.classList.add('correct');
            playSound('correct');

            setTimeout(() => {
              currentIndex++;
              renderQuestion();
            }, CORRECT_DELAY_MS);
          } else {
            btn.classList.add('wrong');
            playSound('wrong');

            // 画面小シェイク
            spotCard.classList.remove('shake');
            void spotCard.offsetWidth;
            spotCard.classList.add('shake');

            // 正解選択肢をハイライト
            choiceButtons.forEach(b => {
              if (b.textContent === currentQuestion.prefecture) {
                b.classList.add('reveal');
              }
            });

            setTimeout(() => {
              spotCard.classList.remove('shake');
              currentIndex++;
              renderQuestion();
            }, WRONG_DELAY_MS);
          }
        });
      });

      // タイムアウト処理（8秒切れ）
      function handleTimeout() {
        if (isAnswerLocked || !isGameActive || !currentQuestion) return;

        isAnswerLocked = true;
        choicesContainer.classList.add('disabled');
        if (timerAnimId) cancelAnimationFrame(timerAnimId);

        resultsLog.push({
          spot: currentQuestion.spot,
          genre: currentQuestion.genre,
          icon: currentQuestion.icon,
          correctPref: currentQuestion.prefecture,
          userPref: null, // 時間切れ
          isCorrect: false,
          mapQuery: currentQuestion.mapQuery
        });

        playSound('timeout');

        // 正解選択肢をハイライト
        choiceButtons.forEach(b => {
          if (b.textContent === currentQuestion.prefecture) {
            b.classList.add('reveal');
          }
        });

        setTimeout(() => {
          currentIndex++;
          renderQuestion();
        }, TIMEOUT_DELAY_MS);
      }

      // ゲーム終了・リザルト描画
      function finishGame() {
        isGameActive = false;
        if (timerAnimId) cancelAnimationFrame(timerAnimId);
        playSound('finish');

        // 称号判定（20問基準）
        let rankText = "旅支度中 🎒";
        if (correctCount === 20) rankText = "全国観光大使 🏆";
        else if (correctCount >= 16) rankText = "ご当地マスター 🗾";
        else if (correctCount >= 12) rankText = "一人前の旅人 🧳";
        else if (correctCount >= 8) rankText = "見習いナビゲーター 🧭";

        resultRank.textContent = rankText;
        resultCorrectNum.textContent = correctCount;
        resultAccuracy.textContent = `${Math.round((correctCount / TOTAL_QUESTIONS) * 100)}%`;

        // 答え合わせリスト構築
        renderReviewList();

        showScreen(screenResult);
      }

      // 答え合わせ一覧の生成
      function renderReviewList() {
        reviewList.innerHTML = '';

        resultsLog.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = `review-card ${item.isCorrect ? 'correct-item' : 'wrong-item'}`;

          const statusBadge = item.isCorrect 
            ? `<span class="review-status-tag correct">⭕ 正解</span>`
            : (item.userPref === null 
                ? `<span class="review-status-tag wrong">⏰ 時間切れ</span>` 
                : `<span class="review-status-tag wrong">❌ 不正解</span>`);

          let answerDetails = `正解: <strong class="review-correct-pref">${item.correctPref}</strong>`;
          if (!item.isCorrect) {
            if (item.userPref) {
              answerDetails += `<br><span class="review-user-pref incorrect">あなたの回答: ${item.userPref}</span>`;
            } else {
              answerDetails += `<br><span class="review-user-pref incorrect">あなたの回答: （未回答）</span>`;
            }
          }

          const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery)}`;

          card.innerHTML = `
            <div class="review-card-header">
              <div class="review-spot-title">
                <span>${item.icon}</span>
                <span>${item.spot}</span>
              </div>
              ${statusBadge}
            </div>
            <div class="review-card-body">
              <div class="review-answer-info">
                ${answerDetails}
              </div>
              <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="map-btn">
                🗺️ マップで見る
              </a>
            </div>
          `;

          reviewList.appendChild(card);
        });
      }

      // イベントリスナー登録
      startBtn.addEventListener('click', startGame);
      retryBtn.addEventListener('click', startGame);

    })();
  </script>
