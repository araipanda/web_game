<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>飛び立て！ずんだもん（Flappy Zundamon）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #1e261d;
      color: #333;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      touch-action: manipulation;
    }
    #game-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      max-width: 450px;
      max-height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #70c5ce;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
    }
    #home-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #5a9e32;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      outline: none;
      transition: transform 0.1s;
    }
    #home-btn:active {
      transform: scale(0.92);
    }
    #sound-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #5a9e32;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      outline: none;
      transition: transform 0.1s;
    }
    #sound-toggle:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <a href="index.html" id="home-btn" aria-label="ゲーム一覧へ戻る">🏠</a>
    <button id="sound-toggle" aria-label="サウンド切り替え">🔊</button>
    <canvas id="gameCanvas" width="360" height="640"></canvas>
  </div>

  <script>
    (function () {
      'use strict';

      // --- 定数・ゲーム設定 ---
      const CANVAS_WIDTH = 360;
      const CANVAS_HEIGHT = 640;
      const GROUND_HEIGHT = 80;
      const PLAYABLE_HEIGHT = CANVAS_HEIGHT - GROUND_HEIGHT;

      // 物理パラメータ（60fps基準）
      const GRAVITY = 0.25;
      const JUMP_VELOCITY = -5.2;
      const MAX_VELOCITY = 8.0;
      const INITIAL_SCROLL_SPEED = 2.0;
      const MAX_SCROLL_SPEED = 3.2;

      // 難易度パラメータ（枝豆サヤ障害物）
      const INITIAL_PIPE_GAP = 135;
      const MIN_PIPE_GAP = 105;
      const PIPE_WIDTH = 58;
      const PIPE_SPAWN_DIST = 190; // パイプ同士の間隔（px）

      // --- 状態管理 ---
      const STATES = { READY: 0, PLAYING: 1, GAMEOVER: 2 };
      let state = STATES.READY;

      let score = 0;
      let highScore = parseInt(localStorage.getItem('zunda_flappy_highscore') || '0', 10);
      let isMuted = localStorage.getItem('zunda_flappy_sound_muted') === 'true';

      // --- オーディオエンジン（Web Audio API） ---
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(type) {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.exponentialRampToValueAtTime(840, now + 0.09);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'score') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.07); // E5
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
            osc.start(now);
            osc.stop(now + 0.16);
          } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.22);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
            osc.start(now);
            osc.stop(now + 0.25);
          }
        } catch (e) {
          // オーディオエラーはゲーム進行を止めない
        }
      }

      // サウンドUI更新
      const soundBtn = document.getElementById('sound-toggle');
      function updateSoundBtn() {
        soundBtn.textContent = isMuted ? '🔇' : '🔊';
      }
      updateSoundBtn();
      soundBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        isMuted = !isMuted;
        localStorage.setItem('zunda_flappy_sound_muted', isMuted);
        updateSoundBtn();
      });

      // ホームボタン（誤タップ伝播防止）
      const homeBtn = document.getElementById('home-btn');
      if (homeBtn) {
        ['pointerdown', 'touchstart', 'click'].forEach((evt) => {
          homeBtn.addEventListener(evt, (e) => e.stopPropagation());
        });
      }

      // --- キャンバス準備 ---
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      // roundRect ポリフィル（Safari 16未満・古いWebView等の未対応環境フォールバック）
      function polyfillRoundRect(x, y, w, h, radii) {
        let r = radii || 0;
        if (typeof r === 'number') {
          r = [r, r, r, r];
        } else if (Array.isArray(r)) {
          if (r.length === 1) r = [r[0], r[0], r[0], r[0]];
          else if (r.length === 2) r = [r[0], r[1], r[0], r[1]];
          else if (r.length === 3) r = [r[0], r[1], r[2], r[1]];
        }
        const [tl, tr, br, bl] = r;
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.arcTo(x + w, y, x + w, y + tr, tr);
        this.lineTo(x + w, y + h - br);
        this.arcTo(x + w, y + h, x + w - br, y + h, br);
        this.lineTo(x + bl, y + h);
        this.arcTo(x, y + h, x, y + h - bl, bl);
        this.lineTo(x + tl, y);
        this.arcTo(x, y, x + tl, y, tl);
        this.closePath();
        return this;
      }
      if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = polyfillRoundRect;
      }
      if (!ctx.roundRect) {
        ctx.roundRect = polyfillRoundRect;
      }

      // --- 自機（ずんだもん）オブジェクト ---
      const zunda = {
        x: 85,
        y: 280,
        radius: 17, // 当たり判定用（実際の描画幅約40pxに対し少し甘め）
        velocity: 0,
        rotation: 0,
        wingPhase: 0,
        reset() {
          this.x = 85;
          this.y = 280;
          this.velocity = 0;
          this.rotation = 0;
          this.wingPhase = 0;
        },
        jump() {
          this.velocity = JUMP_VELOCITY;
          playSound('jump');
        },
        update(dt) {
          if (state === STATES.READY) {
            // ふわふわ浮遊演出
            this.wingPhase += 0.08 * dt;
            this.y = 280 + Math.sin(this.wingPhase) * 8;
            this.rotation = 0;
            return;
          }

          this.velocity = Math.min(this.velocity + GRAVITY * dt, MAX_VELOCITY);
          this.y += this.velocity * dt;
          this.wingPhase += 0.15 * dt;

          // 上下速度に応じた傾き演出（-25度 〜 +65度）
          if (this.velocity < 0) {
            this.rotation = Math.max(-0.45, this.velocity * 0.08);
          } else {
            this.rotation = Math.min(1.1, this.velocity * 0.12);
          }
        },
        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);

          // 枝豆モチーフのまるまるボディ
          // 影
          ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
          ctx.beginPath();
          ctx.ellipse(0, 16, 16, 5, 0, 0, Math.PI * 2);
          ctx.fill();

          // 翼（枝豆の葉っぱ・羽ばたき）
          ctx.save();
          const wingAngle = Math.sin(this.wingPhase * 2) * 0.4;
          ctx.translate(-10, 2);
          ctx.rotate(wingAngle);
          ctx.fillStyle = '#6ab82d';
          ctx.beginPath();
          ctx.ellipse(-10, 0, 11, 6, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#47831c';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();

          // 体（鮮やかなずんだグリーン）
          ctx.fillStyle = '#8ce03f';
          ctx.strokeStyle = '#4e941f';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.ellipse(0, 0, 20, 17, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // おなかハイライト
          ctx.fillStyle = '#aaf36a';
          ctx.beginPath();
          ctx.ellipse(2, 4, 13, 10, 0, 0, Math.PI * 2);
          ctx.fill();

          // 頭の房（枝豆のお耳ヘタ）
          ctx.fillStyle = '#5aa324';
          ctx.beginPath();
          ctx.arc(-4, -18, 5, 0, Math.PI * 2);
          ctx.arc(5, -18, 5, 0, Math.PI * 2);
          ctx.arc(1, -21, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#3e7517';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // つぶらな目（右向き）
          ctx.fillStyle = '#222';
          ctx.beginPath();
          ctx.arc(8, -2, 3.2, 0, Math.PI * 2);
          ctx.fill();
          // 白目ハイライト
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(9.2, -3.2, 1.2, 0, Math.PI * 2);
          ctx.fill();

          // ほっぺ（ピンクのチーク）
          ctx.fillStyle = 'rgba(255, 120, 140, 0.65)';
          ctx.beginPath();
          ctx.arc(5, 5, 3.5, 0, Math.PI * 2);
          ctx.fill();

          // にっこり口
          ctx.strokeStyle = '#4e7e23';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(12, 1, 3, 0.2, Math.PI * 0.7);
          ctx.stroke();

          ctx.restore();
        }
      };

      // --- 障害物（枝豆サヤパイプ）管理 ---
      let pipes = [];
      let nextPipeSpawnX = 0;

      function getDifficulty() {
        // スコアに応じて速度微増・隙間微減（マイルド調整）
        const speed = Math.min(INITIAL_SCROLL_SPEED + Math.floor(score / 8) * 0.12, MAX_SCROLL_SPEED);
        const gap = Math.max(INITIAL_PIPE_GAP - Math.floor(score / 5) * 3, MIN_PIPE_GAP);
        return { speed, gap };
      }

      function spawnPipe(startX) {
        const { gap } = getDifficulty();
        // 隙間のY位置（上下に最低40pxの余裕）
        const minCenterY = 60 + gap / 2;
        const maxCenterY = PLAYABLE_HEIGHT - 60 - gap / 2;
        const centerY = minCenterY + Math.random() * (maxCenterY - minCenterY);

        pipes.push({
          x: startX,
          centerY: centerY,
          gap: gap,
          passed: false
        });
      }

      function resetPipes() {
        pipes = [];
        nextPipeSpawnX = CANVAS_WIDTH + 120;
        spawnPipe(nextPipeSpawnX);
      }

      // --- 背景描画用パラメータ ---
      let bgOffset = 0;
      let groundOffset = 0;
      let screenShake = 0;

      function drawBackground(ctx, dt) {
        // 空のグラデーション
        const skyGrad = ctx.createLinearGradient(0, 0, 0, PLAYABLE_HEIGHT);
        skyGrad.addColorStop(0, '#58b6e6');
        skyGrad.addColorStop(0.65, '#a1dcf7');
        skyGrad.addColorStop(1, '#daf1fc');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, CANVAS_WIDTH, PLAYABLE_HEIGHT);

        // 雲（遠景）
        if (state !== STATES.GAMEOVER) {
          bgOffset = (bgOffset + 0.3 * dt) % CANVAS_WIDTH;
        }
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        for (let i = -1; i <= 2; i++) {
          const cx = i * 220 - (bgOffset * 0.8) % 220;
          ctx.beginPath();
          ctx.arc(cx + 40, 90, 22, 0, Math.PI * 2);
          ctx.arc(cx + 65, 80, 28, 0, Math.PI * 2);
          ctx.arc(cx + 90, 90, 20, 0, Math.PI * 2);
          ctx.fill();
        }

        // 遠景の山並み
        ctx.fillStyle = '#8dc48b';
        ctx.beginPath();
        ctx.moveTo(0, PLAYABLE_HEIGHT);
        for (let x = 0; x <= CANVAS_WIDTH; x += 30) {
          const my = PLAYABLE_HEIGHT - 35 + Math.sin((x + bgOffset * 0.5) * 0.015) * 18;
          ctx.lineTo(x, my);
        }
        ctx.lineTo(CANVAS_WIDTH, PLAYABLE_HEIGHT);
        ctx.closePath();
        ctx.fill();
      }

      // 枝豆サヤ（障害物）描画関数
      function drawEdamamePod(ctx, x, topY, height, isTop) {
        ctx.save();
        ctx.translate(x, topY);

        const w = PIPE_WIDTH;
        const h = height;

        // メインカラーグラデーション（サヤの立体感）
        const podGrad = ctx.createLinearGradient(0, 0, w, 0);
        podGrad.addColorStop(0, '#438a1e');
        podGrad.addColorStop(0.25, '#68b92d');
        podGrad.addColorStop(0.75, '#84d43f');
        podGrad.addColorStop(1, '#3a7a19');

        ctx.fillStyle = podGrad;
        ctx.strokeStyle = '#275710';
        ctx.lineWidth = 2.5;

        // サヤのパス描画（豆のポコポコしたふくらみ）
        ctx.beginPath();
        if (isTop) {
          // 上から伸びるサヤ（下端が先端ヘタ・ふくらみ）
          ctx.moveTo(4, 0);
          ctx.lineTo(0, h - 25);
          // 豆の凹凸カーブ
          ctx.bezierCurveTo(4, h - 10, w / 2 - 10, h + 4, w / 2, h + 4);
          ctx.bezierCurveTo(w / 2 + 10, h + 4, w - 4, h - 10, w, h - 25);
          ctx.lineTo(w - 4, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // サヤ先端のヘタ（キャップ）
          ctx.fillStyle = '#4f9422';
          ctx.beginPath();
          ctx.roundRect(-4, h - 16, w + 8, 16, 6);
          ctx.fill();
          ctx.stroke();

          // 豆の丸みハイライト（3つの豆の膨らみ）
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          for (let bumpY = 40; bumpY < h - 20; bumpY += 60) {
            ctx.beginPath();
            ctx.ellipse(w * 0.4, bumpY, 12, 22, -0.1, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          // 下から生えるサヤ（上端が先端ヘタ・ふくらみ）
          ctx.moveTo(0, 25);
          ctx.bezierCurveTo(4, 10, w / 2 - 10, -4, w / 2, -4);
          ctx.bezierCurveTo(w / 2 + 10, -4, w - 4, 10, w, 25);
          ctx.lineTo(w - 4, h);
          ctx.lineTo(4, h);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // サヤ先端のヘタ（キャップ）
          ctx.fillStyle = '#4f9422';
          ctx.beginPath();
          ctx.roundRect(-4, 0, w + 8, 16, 6);
          ctx.fill();
          ctx.stroke();

          // 豆の丸みハイライト
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          for (let bumpY = 55; bumpY < h; bumpY += 60) {
            ctx.beginPath();
            ctx.ellipse(w * 0.4, bumpY, 12, 22, 0.1, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.restore();
      }

      function drawGround(ctx, dt) {
        const { speed } = getDifficulty();
        if (state !== STATES.GAMEOVER) {
          groundOffset = (groundOffset + speed * dt) % 24;
        }

        // 地面ベース（土）
        ctx.fillStyle = '#ded895';
        ctx.fillRect(0, PLAYABLE_HEIGHT, CANVAS_WIDTH, GROUND_HEIGHT);

        // 芝生トップバー
        ctx.fillStyle = '#5fb32b';
        ctx.fillRect(0, PLAYABLE_HEIGHT, CANVAS_WIDTH, 14);
        ctx.fillStyle = '#43831b';
        ctx.fillRect(0, PLAYABLE_HEIGHT + 14, CANVAS_WIDTH, 4);

        // スクロールする芝のストライプ
        ctx.fillStyle = '#77c93e';
        for (let x = -groundOffset; x < CANVAS_WIDTH + 24; x += 24) {
          ctx.beginPath();
          ctx.moveTo(x, PLAYABLE_HEIGHT);
          ctx.lineTo(x + 12, PLAYABLE_HEIGHT);
          ctx.lineTo(x + 6, PLAYABLE_HEIGHT + 14);
          ctx.closePath();
          ctx.fill();
        }
      }

      // --- 当たり判定（AABB + 円形） ---
      function checkCollision(pipe) {
        const topPipeBottom = pipe.centerY - pipe.gap / 2;
        const bottomPipeTop = pipe.centerY + pipe.gap / 2;

        // 水平方向の重なりチェック
        const zL = zunda.x - zunda.radius;
        const zR = zunda.x + zunda.radius;
        const pL = pipe.x;
        const pR = pipe.x + PIPE_WIDTH;

        if (zR > pL && zL < pR) {
          // 上部パイプとの衝突
          if (zunda.y - zunda.radius < topPipeBottom) return true;
          // 下部パイプとの衝突
          if (zunda.y + zunda.radius > bottomPipeTop) return true;
        }
        return false;
      }

      function triggerGameOver() {
        state = STATES.GAMEOVER;
        playSound('hit');
        screenShake = 18; // 画面振動
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('zunda_flappy_highscore', highScore);
        }
      }

      // --- アクション処理（タップ・クリック・キー入力） ---
      function handleAction() {
        initAudio();
        if (state === STATES.READY) {
          state = STATES.PLAYING;
          zunda.jump();
        } else if (state === STATES.PLAYING) {
          zunda.jump();
        } else if (state === STATES.GAMEOVER) {
          // すぐのリトライ誤爆を防ぐため落下完了またはタップで復帰
          restartGame();
        }
      }

      function restartGame() {
        score = 0;
        zunda.reset();
        resetPipes();
        state = STATES.READY;
      }

      // イベントリスナー
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault();
          handleAction();
        }
      });

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleAction();
      });

      // --- UI描画（スコア、タイトル、ゲームオーバー） ---
      function drawUI(ctx) {
        if (state === STATES.PLAYING) {
          // プレイ中スコア表示（中央上部）
          ctx.save();
          ctx.font = 'bold 38px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#275211';
          ctx.lineWidth = 6;
          ctx.strokeText(score, CANVAS_WIDTH / 2, 60);
          ctx.fillText(score, CANVAS_WIDTH / 2, 60);
          ctx.restore();
        } else if (state === STATES.READY) {
          // READY画面
          ctx.save();
          ctx.textAlign = 'center';

          // タイトルバナー
          ctx.font = 'bold 28px sans-serif';
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#2d6812';
          ctx.lineWidth = 5;
          ctx.strokeText('飛び立て！ずんだもん', CANVAS_WIDTH / 2, 170);
          ctx.fillText('飛び立て！ずんだもん', CANVAS_WIDTH / 2, 170);

          // サブタイトル
          ctx.font = '14px sans-serif';
          ctx.fillStyle = '#2d6812';
          ctx.fillText('〜 枝豆サヤをくぐり抜けるのだ！ 〜', CANVAS_WIDTH / 2, 198);

          // タップ案内
          const pulse = (Math.sin(Date.now() * 0.006) + 1) * 0.5;
          ctx.font = 'bold 18px sans-serif';
          ctx.fillStyle = `rgba(255, 255, 255, ${0.7 + pulse * 0.3})`;
          ctx.strokeStyle = '#275211';
          ctx.lineWidth = 4;
          ctx.strokeText('タップしてスタートなのだ！', CANVAS_WIDTH / 2, 380);
          ctx.fillText('タップしてスタートなのだ！', CANVAS_WIDTH / 2, 380);

          // ハイスコア表示
          if (highScore > 0) {
            ctx.font = 'bold 14px sans-serif';
            ctx.fillStyle = '#316315';
            ctx.fillText(`ベストスコア: ${highScore}`, CANVAS_WIDTH / 2, 420);
          }

          ctx.restore();
        } else if (state === STATES.GAMEOVER) {
          // ゲームオーバー画面
          ctx.save();
          ctx.textAlign = 'center';

          // 半透明オーバーレイ
          ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
          ctx.fillRect(0, 0, CANVAS_WIDTH, PLAYABLE_HEIGHT);

          // スコアボード枠
          const boardW = 260;
          const boardH = 175;
          const boardX = (CANVAS_WIDTH - boardW) / 2;
          const boardY = 180;

          ctx.fillStyle = '#fefdf4';
          ctx.strokeStyle = '#438a1e';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.roundRect(boardX, boardY, boardW, boardH, 16);
          ctx.fill();
          ctx.stroke();

          // 見出し
          ctx.font = 'bold 22px sans-serif';
          ctx.fillStyle = '#c72e2e';
          ctx.fillText('GAME OVER なのだ！', CANVAS_WIDTH / 2, boardY + 36);

          // スコア
          ctx.font = '16px sans-serif';
          ctx.fillStyle = '#555';
          ctx.fillText('今回のスコア', CANVAS_WIDTH / 2, boardY + 70);
          ctx.font = 'bold 28px sans-serif';
          ctx.fillStyle = '#2d6812';
          ctx.fillText(score, CANVAS_WIDTH / 2, boardY + 102);

          // ベストスコア
          ctx.font = 'bold 14px sans-serif';
          ctx.fillStyle = '#d97706';
          ctx.fillText(`🏆 ベスト: ${highScore}`, CANVAS_WIDTH / 2, boardY + 135);

          // リトライ案内
          ctx.font = 'bold 18px sans-serif';
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#2d6812';
          ctx.lineWidth = 4;
          ctx.strokeText('タップしてリトライなのだ！', CANVAS_WIDTH / 2, boardY + boardH + 45);
          ctx.fillText('タップしてリトライなのだ！', CANVAS_WIDTH / 2, boardY + boardH + 45);

          ctx.restore();
        }
      }

      // --- メインゲームループ（deltaTime正規化・FPS非依存） ---
      let lastTime = 0;

      function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaMs = timestamp - lastTime;
        lastTime = timestamp;

        // 60fps（16.67ms）を基準 1.0 とする係数 dt
        // タブ切り替え復帰時等の異常ワープを防ぐクランプ（上限 3.0）
        const dt = Math.min(deltaMs / (1000 / 60), 3.0);

        // 画面揺れ減衰
        if (screenShake > 0) {
          screenShake = Math.max(0, screenShake - 0.9 * dt);
        }

        // --- 更新処理 ---
        zunda.update(dt);

        if (state === STATES.PLAYING) {
          const { speed } = getDifficulty();

          // 障害物のスクロールと生成
          for (let i = 0; i < pipes.length; i++) {
            const p = pipes[i];
            p.x -= speed * dt;

            // スコア加算判定（自機のX座標を通過した瞬間）
            if (!p.passed && p.x + PIPE_WIDTH < zunda.x) {
              p.passed = true;
              score += 1;
              playSound('score');
            }

            // 当たり判定チェック
            if (checkCollision(p)) {
              triggerGameOver();
              break;
            }
          }

          // 画面外に出たパイプを破棄
          pipes = pipes.filter((p) => p.x + PIPE_WIDTH > -20);

          // 次のパイプのスポーン判定
          const lastPipe = pipes[pipes.length - 1];
          if (!lastPipe || lastPipe.x < CANVAS_WIDTH - PIPE_SPAWN_DIST) {
            spawnPipe(CANVAS_WIDTH + 20);
          }

          // 地面接触または天井接触判定
          if (zunda.y + zunda.radius >= PLAYABLE_HEIGHT) {
            zunda.y = PLAYABLE_HEIGHT - zunda.radius;
            triggerGameOver();
          } else if (zunda.y - zunda.radius <= 0) {
            zunda.y = zunda.radius;
            zunda.velocity = 0;
          }
        } else if (state === STATES.GAMEOVER) {
          // ゲームオーバー時も自機は地面まで落下
          if (zunda.y + zunda.radius < PLAYABLE_HEIGHT) {
            zunda.velocity = Math.min(zunda.velocity + GRAVITY * dt, MAX_VELOCITY);
            zunda.y += zunda.velocity * dt;
          } else {
            zunda.y = PLAYABLE_HEIGHT - zunda.radius;
          }
        }

        // --- 描画処理 ---
        ctx.save();
        if (screenShake > 0) {
          const shakeX = (Math.random() - 0.5) * screenShake;
          const shakeY = (Math.random() - 0.5) * screenShake;
          ctx.translate(shakeX, shakeY);
        }

        // 背景
        drawBackground(ctx, dt);

        // 障害物（枝豆サヤ）
        for (let i = 0; i < pipes.length; i++) {
          const p = pipes[i];
          const topH = p.centerY - p.gap / 2;
          const bottomY = p.centerY + p.gap / 2;
          const bottomH = PLAYABLE_HEIGHT - bottomY;

          // 上のサヤ
          drawEdamamePod(ctx, p.x, 0, topH, true);
          // 下のサヤ
          drawEdamamePod(ctx, p.x, bottomY, bottomH, false);
        }

        // 地面
        drawGround(ctx, dt);

        // 自機（ずんだもん）
        zunda.draw(ctx);

        // UI
        drawUI(ctx);

        ctx.restore();

        requestAnimationFrame(gameLoop);
      }

      // ゲーム初期化・起動
      resetPipes();
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
